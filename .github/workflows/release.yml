name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastris-release
  cancel-in-progress: false

env:
  EM_VERSION: '6.0.5'
  SDL_ANDROID_URL: https://github.com/libsdl-org/SDL/releases/download/release-3.4.14/SDL3-devel-3.4.14-android.zip
  SDL_ANDROID_SHA256: e41691e75433b2a0a75685781bed2160fe4a85f75f3803f7f43d1811e212e3ef

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repository sanity checks
        run: python3 scripts/ci_sanity.py
      - id: version
        name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Releases must run from the main branch; got '$GITHUB_REF_NAME'." >&2
            exit 1
          fi

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be MAJOR.MINOR.PATCH; got '$VERSION'" >&2
            exit 1
          fi
          TAG="v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Preparing FasTris $VERSION from $GITHUB_SHA"

  tests:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure deterministic core tests
        run: cmake -S . -B build-tests -DFASTTRIS_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build tests
        run: cmake --build build-tests --parallel
      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -A x64 -DFASTTRIS_BUILD_TESTS=OFF -DFASTTRIS_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package single executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = 'build/Release/FasTris.exe'
          if (-not (Test-Path $exe)) { throw "Missing expected output: $exe" }
          Copy-Item $exe 'dist/FasTris.exe'
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/FasTris.exe
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFASTTRIS_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          stage="dist/FasTris-v${version}-linux-x86_64"
          mkdir -p "$stage"
          for file in FasTris fastris_verify fastris_sequence fastris_bench; do
            test -x "build/$file"
            cp "build/$file" "$stage/"
          done
          mkdir -p "$stage/share/applications" "$stage/share/icons/hicolor/512x512/apps"
          cp platform/linux/com.draconov.fastris.desktop "$stage/share/applications/"
          cp platform/linux/com.draconov.fastris.png "$stage/share/icons/hicolor/512x512/apps/"
          cp README.md VERSION "$stage/"
          tar -C dist -czf "dist/FasTris-Linux.tar.gz" "FasTris-v${version}-linux-x86_64"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Configure universal macOS build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DFASTTRIS_BUILD_TESTS=OFF -DFASTTRIS_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Verify universal app
        run: |
          set -euo pipefail
          BIN="build/FasTris.app/Contents/MacOS/FasTris"
          test -x "$BIN"
          test -s "build/FasTris.app/Contents/Resources/FasTris.icns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' build/FasTris.app/Contents/Info.plist | grep -Fxq 'FasTris.icns'
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | tr ' ' '\n' | grep -Fxq x86_64
          echo "$ARCHS" | tr ' ' '\n' | grep -Fxq arm64
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          stage="dist/FasTris-v${version}-macos-universal"
          mkdir -p "$stage"
          cp -R build/FasTris.app "$stage/"
          cp README.md VERSION "$stage/"
          ditto -c -k --sequesterRsrc --keepParent "$stage" "dist/FasTris-macOS.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  web:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip
      - name: Configure
        run: emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DFASTTRIS_BUILD_TESTS=OFF -DFASTTRIS_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build-web --parallel
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          test -s build-web/index.html
          test -s build-web/index.js
          test -s build-web/index.wasm
          test -s build-web/favicon.ico
          test -s build-web/favicon.png
          test -s build-web/apple-touch-icon.png
          test -s build-web/icon-192.png
          test -s build-web/icon-512.png
          test -s build-web/manifest.webmanifest
          version="${{ needs.version.outputs.version }}"
          stage="dist/FasTris-v${version}-web"
          mkdir -p "$stage"
          find build-web -maxdepth 1 -type f \
            \( -name 'index.*' -o -name '*.data' -o -name '*.worker.js' -o -name 'favicon.*' \
               -o -name 'apple-touch-icon.png' -o -name 'icon-192.png' -o -name 'icon-512.png' \
               -o -name 'manifest.webmanifest' \) -exec cp {} "$stage/" \;
          cp VERSION "$stage/"
          (cd "$stage" && zip -9 -r "../FasTris-Web.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/*.zip
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK/NDK/CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Download pinned SDL3 Android archive
        shell: bash
        run: bash scripts/prepare_sdl_android.sh
      - name: Build debug-signed test APK
        run: gradle --no-daemon -p platform/android :app:assembleDebug --stacktrace
      - name: Verify and package test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="platform/android/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$apk" ]]; then
            echo "Debug APK was not produced." >&2
            find platform/android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [[ ! -x "$APKSIGNER" ]]; then
            echo "apksigner not found at $APKSIGNER" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          cp "$apk" "dist/FasTris.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/FasTris.apk
          if-no-files-found: error

  release:
    needs: [version, tests, windows, linux, macos, web, android]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/FasTris.exe"
          test -s "dist/FasTris-Linux.tar.gz"
          test -s "dist/FasTris-macOS.zip"
          test -s "dist/FasTris-Web.zip"
          test -s "dist/FasTris.apk"

      - name: Create checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum \
            FasTris.exe \
            FasTris-Linux.tar.gz \
            FasTris-macOS.zip \
            FasTris-Web.zip \
            FasTris.apk \
            > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$TAG")"
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo "Refreshing $TAG from $tagged_sha to tested commit $GITHUB_SHA."
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                -f sha="$GITHUB_SHA" \
                -F force=true >/dev/null
            fi
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refreshing existing FasTris $VERSION release."
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FasTris v$VERSION" \
              --latest

            echo "Removing obsolete generated assets from older release layouts."
            while IFS= read -r asset; do
              [[ -z "$asset" ]] && continue
              case "$asset" in
                FasTris.exe|FasTris-Linux.tar.gz|FasTris-macOS.zip|FasTris-Web.zip|FasTris.apk|SHA256SUMS.txt)
                  ;;
                *)
                  gh release delete-asset "$TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
                  ;;
              esac
            done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FasTris v$VERSION" \
              --generate-notes \
              --latest
          fi

          gh release upload "$TAG" \
            dist/FasTris.exe \
            dist/FasTris-Linux.tar.gz \
            dist/FasTris-macOS.zip \
            dist/FasTris-Web.zip \
            dist/FasTris.apk \
            dist/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
