name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EM_VERSION: '6.0.5'

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure web build
        run: emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DFASTTRIS_BUILD_TESTS=OFF -DFASTTRIS_BUILD_TOOLS=OFF
      - name: Build web version
        run: cmake --build build-web --parallel
      - name: Verify browser bundle
        run: |
          set -euo pipefail
          test -s build-web/index.html
          test -s build-web/index.js
          test -s build-web/index.wasm
          touch build-web/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build-web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
